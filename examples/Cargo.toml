[package]
name = "sveltui-examples"
description = "Runnable examples for the sveltui workspace."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
publish = false
autoexamples = false

[dependencies]
sveltui.workspace = true
sveltui-components.workspace = true
sveltui-code.workspace = true
sveltui-image = { workspace = true, features = ["kitty", "iterm2", "sixel", "network"] }
crossterm.workspace = true
image = { workspace = true, features = ["png"] }

