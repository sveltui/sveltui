[workspace]
resolver = "2"
members = [
    "crates/sveltui-code",
    "crates/sveltui-components",
    "crates/sveltui-macros",
    "crates/sveltui",
    "examples",
]
default-members = ["crates/sveltui", "examples"]

[workspace.package]
version = "0.1.0-alpha.3"
edition = "2024"
rust-version = "1.85"
authors = ["themosthigh"]
license = "AGPL-3.0-or-later"
repository = "https://github.com/themosthigh/sveltui"
homepage = "https://github.com/themosthigh/sveltui"
keywords = ["tui", "terminal", "reactive", "svelte", "ui"]
categories = ["command-line-interface", "gui"]

[workspace.dependencies]
sveltui = { path = "crates/sveltui", version = "0.1.0-alpha.3" }
sveltui-code = { path = "crates/sveltui-code", version = "0.1.0-alpha.3" }
sveltui-components = { path = "crates/sveltui-components", version = "0.1.0-alpha.3" }
sveltui-macros = { path = "crates/sveltui-macros", version = "0.1.0-alpha.3" }
crossterm = "0.28"
taffy = { version = "0.13", default-features = false, features = ["std", "alloc", "flexbox", "grid", "content_size", "detailed_layout_info", "taffy_tree"] }
criterion = { version = "0.5", default-features = false }
syntect = { version = "5.2", default-features = false, features = ["default-syntaxes", "default-themes", "regex-fancy"] }
